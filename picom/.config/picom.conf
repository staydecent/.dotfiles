# general
backend = "xrender";
vsync	= false;

# corners
corner-radius = 0;
detect-rounded-corners = true;
rounded-corners-exclude = [
	"class_g = 'dmenu' && x = 0 && y = 0",
    "class_g = 'Polybar'",
    "class_g = 'Dunst'",
	"window_type = 'tooltip'",
];

# fading
fading          = true;
fade-delta      = 3.5;
fade-in-step    = 0.02;
fade-out-step   = 0.02;
fade-exclude = [
	"g:e:dmenu"
];

# opacity
inactive-dim              = 0.3;
inactive-opacity-override = true;
blur-background-exclude   = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# shadows
shadow                  =  true ;
dnd 					=  true ;
no-dock-shadow			=  true ;
shadow-radius           =  14   ;
shadow-offset-x         =  -12  ;
shadow-offset-y         =  -12  ;
shadow-opacity          =  0.40 ;
shadow-exclude = [
	#"class_g = 'Polybar'"
	"g:e:Conky",
	"class_g ?= 'Dunst'",
	"class_g = 'slop'",
	"_NET_WM_STATE@:32a = '_NET_WM_STATE_FULLSCREEN'",
];
